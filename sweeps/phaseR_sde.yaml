# Phase R — SDE sampling on continuous methods (eval-only).
#
# Each cell is an *eval-only* run: it loads an existing checkpoint and
# evaluates with method=sde at a specific α. Implemented via the
# eval_only=true marker; run_sweep.py treats those rows as "skip
# training, write eval.json directly using the supplied ckpt path".
#
# Decision criteria in CAPSTONE_EXPERIMENTS.md §4: PASS if best-α
# KL_bi ≤ 0.40 (within 3× of DFM 0.148).

- name: eqm_sde_a0p00_grad
  eval_only: true
  ckpt: runs/capstone/checkpoints/eqm_data50k_ep5_v2/epoch_final.pt
  eval_steps: 128
  sample_kwargs: {method: sde, alpha: 0.0,  use_grad: true}

