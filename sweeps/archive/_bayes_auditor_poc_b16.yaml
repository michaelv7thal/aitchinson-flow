- name: bayes_auditor_poc
  overrides:
    training.model_name: BayesianAuditorAE
    training.epochs: 5
    training.seed: 42
    training.lr: 0.0001
    training.scheduler_warmup_epochs: 1
    training.B: 16
    training.L: 64
    text8_dataset.batch_size: 16
    text8_dataset.L: 64
    text8_dataset.max_train_windows: 20000
    text8_dataset.variable_length: false
    text8_dataset.train_corrupt_rate: 0.15
    text8_dataset.eval_corrupt_rate: 0.15
    text8_dataset.train_order_mix_rate: 0.10
    text8_dataset.eval_order_mix_rate: 0.10
    transformer.d_model: 768
    transformer.num_layers: 8
    transformer.nhead: 12
    autoencoder.d_model: 512
    autoencoder.num_layers: 6
    autoencoder.nhead: 8
    autoencoder.d_latent: 128
    autoencoder.activation: gelu
    autoencoder.tie_embeddings: true
    autoencoder.mode: ae
    eqm_ae.ae_ckpt_path: runs/ae_poc_m/ae/epoch_final.pt
    bayes_auditor.ae_ckpt_path: runs/ae_poc_m/ae/epoch_final.pt
    bayes_auditor.num_inducing: 64
    bayes_auditor.lambda_hinge: 1.0
    bayes_auditor.margin_energy: 2.0
    bayes_auditor.lambda_kl: 0.01
    eqm.lambda_ce: 0.5
    eqm.gamma_power: 0.5
    eqm.source_sigma: 0.577
    eqm.sample_max_steps: 100
    eqm.sample_return_best: true
    training.sample_eval_n: 32
    training.sample_eval_every: 5
    wandb.enabled: false
