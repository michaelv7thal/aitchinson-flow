# Scaled DFM Stage 1: 1.5x params over dfm_svgp_pure50_lr3e4. Same data,
# same lr, same epochs — just wider+deeper backbone and d_embed=K=27.
# After this lands, Stage 2 (scripts/fit_dfm_svgp_hinge.py) trains the
# SVGP via the contrastive hinge with d_embed=27 (matches vocab, breaks
# the curse-of-dimensionality on the std signal).

- name: dfm_svgp_scaled
  overrides:
    training.model_name: DirichletFMSvgp
    training.epochs: 50
    training.seed: 42
    training.lr: 0.0003
    training.scheduler_warmup_epochs: 1
    training.cosine_t_max_epochs: 50
    training.B: 64
    training.L: 40
    training.K: 27
    training.sample_eval_n: 32
    training.sample_eval_every: 10
    text8_dataset.batch_size: 64
    text8_dataset.L: 40
    text8_dataset.K: 27
    text8_dataset.max_train_windows: 10000
    text8_dataset.variable_length: false
    text8_dataset.train_corrupt_rate: 0.15
    text8_dataset.eval_corrupt_rate: 0.15
    transformation.label_smoothing: 0.0001
    transformation.dirichlet_sampling: false
    # Scaled transformer
    transformer.d_model: 1280
    transformer.num_layers: 10
    transformer.nhead: 10
    transformer.d_latent: 64
    dirichlet_fm.t_max: 8.0
    dirichlet_fm.dropout: 0.1
    dirichlet_fm.sample_nfe: 100
    # SVGP head — d_embed matches vocab; kernel collapse mitigated by
    # the d_embed=27 → √d ≈ 5 scale, much better than 256→16.
    dfm_svgp.pooling: "mean"
    dfm_svgp.d_embed: 27
    dfm_svgp.n_inducing: 128
    dfm_svgp.kernel: "matern52"
    dfm_svgp.t_eval: 4.5
    dfm_svgp.lambda_hinge: 0.0          # pure DFM in Stage 1
    dfm_svgp.train_svgp_jointly: false
    dfm_svgp.train_pooler_with_dfm: false
    wandb.enabled: false
