# Same recipe as eqm_sparsemax_bigram (det CLR + sparsemax aux + bigram_joint
# at ce_min_gamma=0.5, MSE flow loss) with the *factorised trigram NLL* added:
# log p(a) + log p(b) + log p(c) on the softmax of pred_x1.
#
# Memory: trigram tensor is (M, L-2, K^3) ≈ 16*38*19683*4 ≈ 48 MB at M≈16
# (ce_min_gamma=0.5, B=64). Plus autograd graph, comfortably fits 8 GB.
#
# All loss components surface in the per-epoch summary line (sorted alpha):
# flow_loss, ce, bg_joint_nll, tg_nll, plus the γ-bucketed g<. and r<. fields.

- name: eqm_sparsemax_bigram_trigram
  overrides:
    training.model_name: EqM
    training.epochs: 5
    training.seed: 42
    training.lr: 0.0003
    training.scheduler_warmup_epochs: 0
    training.B: 64
    training.L: 40
    training.K: 27
    training.sample_eval_n: 32
    training.sample_eval_every: 5
    training.log_every: 1            # show postfix every step
    text8_dataset.batch_size: 64
    text8_dataset.L: 40
    text8_dataset.K: 27
    text8_dataset.max_train_windows: 10000
    text8_dataset.variable_length: false
    transformation.label_smoothing: 0.0001
    transformation.dirichlet_sampling: false
    transformer.d_model: 1024
    transformer.num_layers: 8
    transformer.nhead: 8
    transformer.d_latent: 64
    eqm.time_conditioning: "off"
    eqm.context_features: "off"
    eqm.source_sigma: 0.1
    eqm.gamma_power: 1.5
    eqm.gradient_lambda: 1.0
    eqm.lambda_ce: 0.5
    eqm.aux_kind: "sparsemax"
    eqm.ce_min_gamma: 0.5
    eqm.lambda_bigram: 0.0            # factorised bigram off (use bigram_joint instead)
    eqm.lambda_bigram_joint: 0.5      # K^2 joint head from h_enc
    eqm.lambda_trigram: 0.5           # NEW — factorised trigram log p(a)+log p(b)+log p(c)
    eqm.sample_eta: 0.1
    eqm.sample_mu: 0.9
    eqm.sample_max_steps: 100
    eqm.sample_grad_clip: 1.0
    eqm.sample_return_best: true
    eqm.sampler: nag
    loss.mode: mse
    wandb.enabled: false
