    text8_dataset.max_train_windows: 10000
    embedding.enabled: true
    embedding.d_embed: 27
    embedding.fixed_path: data/skipgram_d27.pt
    embedding.tie_decoder: true
    eqm.sample_return_best: false
    eqm.lambda_ce: 0.0

# Same recipe as the d=128 trainable run but with a 180× smaller transformer
# backbone (d_model=128, 2 layers, ~0.5M vs 90M params). Hypothesis: with
# 90M params the model satisfies CE trivially via embedding self-similarity
# and the FM gradient signal is overwhelmed; a smaller model forces CE and
# FM to share gradient bandwidth from epoch 1. Should also train 10× faster
# so we can run more epochs at fixed wall-clock.
- name: latent_d128_trainable_tied_ce0_smallmodel_ep20
  overrides:
    training.model_name: EqMLatent
    training.epochs: 20
    training.cosine_eta_min: 1.0e-4
    text8_dataset.max_train_windows: 10000
    embedding.enabled: true
    embedding.d_embed: 128
    embedding.tie_decoder: true
    eqm.lambda_ce: 1.0
    eqm.ce_min_gamma: 0.0
    eqm.time_conditioning: add
    eqm.sampler: euler
    eqm.euler_nfe: 200
    eqm.sample_return_best: false
    transformer.d_model: 128
    transformer.num_layers: 2
    transformer.nhead: 4
    transformer.d_latent: 128

- name: latent_d128_trainable_tied_ce0_midmodel_ep20
  overrides:
    training.model_name: EqMLatent
    training.epochs: 20
    training.cosine_eta_min: 1.0e-4
    text8_dataset.max_train_windows: 10000
    embedding.enabled: true
    embedding.d_embed: 128
    embedding.tie_decoder: true
    eqm.lambda_ce: 1.0
    eqm.ce_min_gamma: 0.0
    eqm.time_conditioning: add
    eqm.sampler: euler
    eqm.euler_nfe: 200
    eqm.sample_return_best: false
    transformer.d_model: 256
    transformer.num_layers: 4
    transformer.nhead: 4
    transformer.d_latent: 256

# Trainable embeddings + tied decoder + CE-at-all-γ + time-conditioning +
# Euler sampler (corrected to use ∇⟨x, f⟩). 20-epoch headline cell —
# combines what worked (tied_ce0 hit KL_bi=1.539 at 5ep, slightly better
# than untied 1.597) with the EqM best-practice sampling stack and longer
# training so cosine eta floor doesn't kill the late-training signal.
- name: latent_d128_trainable_tied_ce0_ep20
  overrides:
    training.model_name: EqMLatent
    training.epochs: 20
    training.cosine_eta_min: 1.0e-4
    text8_dataset.max_train_windows: 10000
    embedding.enabled: true
    embedding.d_embed: 128
    embedding.tie_decoder: true
    eqm.lambda_ce: 1.0
    eqm.ce_min_gamma: 0.0
    eqm.time_conditioning: add
    eqm.sampler: euler
    eqm.euler_nfe: 200
    eqm.sample_return_best: false

# Image-EqM-style recipe on text — d=128 skipgram + time-conditioning +
# Euler sampler + no CE. The reference EqM code (raywang4/EqM) actually
# *does* use time-conditioning (TimestepEmbedder + AdaLN-Zero) and walks
# `t` during sampling; the paper's "time-invariant gradient field" claim
# describes the equilibrium training condition, not the sampling procedure.
# We mirror that here. Source noise N(0, σ²·I) ≠ data centroid (skipgram
# centroid_norm=1.08, noise norm at σ=0.1 ≈ 1.13 in d=128) so the symmetric-
# balance centroid trap does not apply structurally.
- name: latent_skipgram_d128_timecond_euler_ep20
  overrides:
    training.model_name: EqMLatent
    training.epochs: 20
    training.cosine_eta_min: 1.0e-4
    text8_dataset.max_train_windows: 10000
    embedding.enabled: true
    embedding.d_embed: 128
    embedding.fixed_path: data/skipgram_d128.pt
    embedding.tie_decoder: true
    eqm.lambda_ce: 0.0
    eqm.time_conditioning: add
    eqm.sampler: euler
    eqm.euler_nfe: 200
    eqm.sample_return_best: false

# σ=0.5 was clearly under-converged at 5 epochs (KL_bi 4.64 → 1.99) but the
# generations were starting to look valid. Run 20 epochs with the same LR
# floor to see if the larger source-noise scale is actually the right
# choice given enough training.
- name: latent_d32_untied_ce0_sigma05_ep20
  overrides:
    training.model_name: EqMLatent
    training.epochs: 20
    training.cosine_eta_min: 1.0e-4
    text8_dataset.max_train_windows: 10000
    embedding.enabled: true
    embedding.d_embed: 32
    eqm.sample_return_best: false
    embedding.tie_decoder: false
    eqm.ce_min_gamma: 0.0
    eqm.lambda_ce: 1.0
    eqm.source_sigma: 0.5

# Frozen-embedding control (Phase 5.4) at d=32.
- name: latent_d32_frozen
  overrides:
    training.model_name: EqMLatent
    training.epochs: 5
    text8_dataset.max_train_windows: 10000
    embedding.enabled: true
    embedding.d_embed: 32
    eqm.sample_return_best: false
    embedding.freeze_steps: 1000000  # never thaw → frozen control
