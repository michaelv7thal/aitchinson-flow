# ═══ gamma_lo LADDER (spine: gamma* = gamma_hi = 0.03, clip 1.0) ════════════
# Question: does raising gamma_lo buy a cleaner/earlier learning transition, and
# where does it start costing generation because the SAMPLER can no longer reach
# the band from pure noise?
#
# Two analytic requirements collide at K=27 (docs/band_geometry_theory.md 6.5):
#   Requirement N (signal): the c^2-weighted training mass must not be dominated
#     by states whose Bayes posterior is uninformative. W = irreducible share.
#   Requirement S (support): the sampler starts at x0, i.e. gamma=0. If
#     gamma_lo > 0 that init is OUTSIDE the trained band, by kappa = t_lo/sqrt(K-1)
#     noise radii. Their feasible sets do not intersect below K ~ 1024, so which
#     one binds is an EMPIRICAL question. This ladder measures it.
#
#   gamma_lo    t_lo   kappa   rho(t_lo)     W      cell
#    0.00000   0.000   0.000      0.000   89.2%   ..._g0_gs030      (arm A, queued)
#    0.00500   0.628   0.123      0.017   81.6%   band_L256_ep10_d10k (published)
#    0.01208   1.530   0.300      0.170   61.4%   ..._g012_gs030    (new)
#    0.01900   2.422   0.475      0.513   35.1%   ..._g019_gs030    (new)
#
# gamma* is PINNED at 0.03 across the ladder so the sampler config is byte-identical
# (eta 0.005 / clip 1.0 / 400 steps) and only gamma_lo moves. The c-ramp does get
# shorter as gamma_lo rises, which shrinks the target norm ~2.3x at gamma_lo=0.019 --
# but Adam's g/sqrt(v) update is invariant to a global loss scaling, so this is not
# a confound on the optimiser. It IS one on the sampler, which sees a proportionally
# weaker field; that is part of what Requirement S is about.
#
# Read TWO things per cell, and the pair is the actual experiment:
#   * generation (stage 1) starts at x0            -> tests Requirement S
#   * recovery  (stage 2) starts at gamma*clr(ids) -> BYPASSES S entirely
# so run stage 2 at ALPHAS="0.3 0.5": alpha=0.3 lands at gamma=0.0260 (inside the
# band for every rung) and alpha=0.5 at gamma=0.0157 (inside for gamma_lo <= 0.0157,
# OUTSIDE for the top rung). The alpha=0.3 vs alpha=0.5 gap on the top rung is a
# within-checkpoint support test that costs nothing extra.
#
# Predicted signatures:
#   recovery up, generation down  -> SNR real, S binding. Turning point = empirical kappa.
#   both up                       -> S not binding at kappa=0.475; push gamma_lo further.
#   both down                     -> the SNR reading of the epoch-7 transition is wrong.
# Also log the transition EPOCH from history.jsonl: 6.4 predicts it moves earlier
# monotonically in gamma_lo. Seed is 42 throughout; a non-monotone ladder is a
# seed-variance suspect before it is a theory result.

# ─── ladder rung kappa=0.30 (W 61.4%) ──────────────────────────────────────
- name: band_L256_ep10_d10k_g012_gs030
  overrides:
    training.model_name: EqM
    wandb.enabled: false
    wandb.mode: disabled
    wandb.log_artifacts: false
    wandb.log_samples: false
