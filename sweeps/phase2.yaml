# Phase 2 mini — backbone scaling at the data_50k_ep5 platform.
# Brackets the question "is the d=1024/8L default the wrong shape for 50k
# windows?" Two cells: smallest sensible model and largest that fits in
# 20 GB MIG. Anything in between can be filled in later.
- name: bb_d256_l4_data50k
  overrides:
    training.epochs: 5
    text8_dataset.max_train_windows: 50000
    transformer.d_model: 256
    transformer.nhead: 4
    transformer.num_layers: 4
- name: bb_d1536_l12_data50k
  overrides:
    training.epochs: 5
    text8_dataset.max_train_windows: 50000
    transformer.d_model: 1536
    transformer.nhead: 16
    transformer.num_layers: 12
