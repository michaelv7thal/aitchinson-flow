[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitchison-flow"
version = "0.1.0"
description = "Uncertainty quantification of LLM tokens via Aitchison geometry and GP score estimation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["uncertainty-quantification", "gaussian-processes", "flow-matching",
            "aitchison-geometry", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "transformers>=5.2.0",
    "datasets>=4.5.0",
    "matplotlib>=3.10.8",
    "gpytorch>=1.15.2",
    "accelerate>=1.13.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
lm = [
    "transformers>=4.40",
    "accelerate>=0.30",
    "datasets>=2.18",
]
benchmarks = [
    "aitchison-flow[lm]",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    "accelerate>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
bench-scaling = "benchmarks.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aitchinson_flow", "benchmarks"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[tool.ruff]
line-length = 100
src = ["src", "benchmarks"]

[tool.mypy]
strict = true

# Scripts under ./scripts import `aitchinson_flow`; package lives under ./src.
[tool.pyright]
extraPaths = ["src"]
pythonVersion = "3.11"

[dependency-groups]
dev = [
    "wandb>=0.25.1",
    "weave>=0.52.35",
]
